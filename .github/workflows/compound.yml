# codewiki: incremental compound on every merge to master/main.
#
# Copy this file into your app monorepo (next to codewiki.yaml). Runs are
# serialized per branch; a run that starts behind HEAD catches up from
# wiki/.kb/state.json last_sha to HEAD in one go (graph diff, not per commit).
name: codewiki compound

on:
  push:
    branches: [master, main]
    paths-ignore: ["wiki/**"]        # the wiki commit itself must not retrigger
  workflow_dispatch:
    inputs:
      full:
        description: "force a full rebuild"
        type: boolean
        default: false

concurrency:
  group: codewiki-compound-${{ github.ref }}
  cancel-in-progress: false          # never drop a merge; queue it

permissions:
  contents: write

env:
  KB_VERSION: latest                 # or a tag / pseudo-version of luckylucky0001/codewiki
  KB_MAX_LLM_TASKS: "12"             # cost guard: remaining tasks use the template writer
  CGO_CFLAGS: "-O2 -w"

jobs:
  test-kb:
    # only meaningful inside the codewiki repo itself (steps are skipped elsewhere)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        if: hashFiles('cmd/kb/main.go') != ''
        with: { go-version: "1.24", cache: true }
      - if: hashFiles('cmd/kb/main.go') != ''
        run: go vet ./... && test -z "$(gofmt -l cmd internal skills)" && go test ./...

  compound:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional; absent → template writer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # kb diff --base / git archive need history

      - name: Check for codewiki.yaml
        id: cfg
        run: |
          if [ -f codewiki.yaml ]; then echo "present=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::no codewiki.yaml at repo root; skipping compound"; fi

      - uses: actions/setup-go@v5
        if: steps.cfg.outputs.present == 'true'
        with: { go-version: "1.24", cache: true }

      - name: Cache kb binary
        if: steps.cfg.outputs.present == 'true'
        id: kbcache
        uses: actions/cache@v4
        with:
          path: ~/go/bin/kb
          key: kb-${{ runner.os }}-${{ env.KB_VERSION }}

      - name: Restore scan cache (per-file parse results keyed by content hash)
        if: steps.cfg.outputs.present == 'true'
        uses: actions/cache@v4
        with:
          path: wiki/.kb/cache
          key: kb-scan-${{ runner.os }}-${{ github.sha }}
          restore-keys: kb-scan-${{ runner.os }}-

      - name: Install kb
        if: steps.cfg.outputs.present == 'true' && steps.kbcache.outputs.cache-hit != 'true'
        run: |
          if [ -f cmd/kb/main.go ]; then go build -o ~/go/bin/kb ./cmd/kb
          else go install github.com/luckylucky0001/codewiki/cmd/kb@${KB_VERSION}; fi

      - name: Install Claude Code (only when an API key is configured)
        if: steps.cfg.outputs.present == 'true' && env.ANTHROPIC_API_KEY != ''
        run: npm install -g @anthropic-ai/claude-code

      - name: kb compound
        if: steps.cfg.outputs.present == 'true'
        id: compound
        run: |
          set -o pipefail
          LLM=template
          if [ -n "${ANTHROPIC_API_KEY}" ]; then LLM=claude; fi
          FULL=""
          if [ "${{ inputs.full }}" = "true" ]; then FULL="--full"; fi
          kb compound --llm "$LLM" --fallback --max-llm-tasks "$KB_MAX_LLM_TASKS" $FULL --keep-work --json > compound.json
          jq -r '.result.message' compound.json

      - name: kb verify (gate)
        if: steps.cfg.outputs.present == 'true'
        run: kb verify

      - name: Publish wiki commit
        if: steps.cfg.outputs.present == 'true'
        run: |
          git config user.name "codewiki-bot"
          git config user.email "codewiki-bot@users.noreply.github.com"
          git add wiki
          if git diff --cached --quiet; then echo "wiki unchanged"; exit 0; fi
          git commit -m "docs(wiki): compound ${GITHUB_SHA::7} [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Upload run record
        if: always() && steps.cfg.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: codewiki-run-${{ github.sha }}
          path: |
            compound.json
            .kb-work/
          if-no-files-found: ignore
