# Human-labelled golden set for `kb eval` (codewiki pipeline evaluation).
# Claims are labelled against the BASE state of examples/minishop (before any
# change set) by reading the code on all three platforms — not by running kb.
# Impact lists the pages a careful human would re-check for each change set.
version: 1
project: ../minishop
changes: ../minishop-changes
