# codewiki configuration. See README.md ("配置").
version: 1
wiki_dir: wiki
project: monoshop
platforms:
    - name: android
      root: apps/shop-android
    - name: ios
      root: apps/shop-ios
exclude:
    - '**/build/**'
    - '**/node_modules/**'
    - '**/.git/**'
    - '**/Pods/**'
    - '**/.kb-work/**'
llm:
    cmd: claude -p --permission-mode acceptEdits --output-format text
    timeout_sec: 600
plan:
    hops: 1
    rebuild_module_ratio: 0.5
    rebuild_structural_ratio: 0.3
docs:
    exclude: []
tree:
    budget_tokens: 2000
